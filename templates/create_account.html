
{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Create New Account</h2>
    <form method="post">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>PIN:</label>
            <input type="password" name="pin" required minlength="4" maxlength="4" pattern="[0-9]*">
        </div>
        <button type="submit" class="btn">Create Account</button>
    </form>
</div>
{% endblock %}
